services:
  - type: web
    name: ai-3d-studio-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGIN
        value: https://vilmusenahojuha-stack.github.io
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_API_KEY
        sync: false
